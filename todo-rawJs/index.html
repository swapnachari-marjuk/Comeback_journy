<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Task Flow - Raw Edition</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      /* কিছু কাস্টম স্টাইল যা টেইলউইন্ড দিয়ে করা জটিল হতে পারে (যেমন: Checkbox checked state) */
      .completed-text {
        text-decoration: line-through;
        color: #9ca3af; /* gray-400 */
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen flex justify-center py-12 px-4">
    <div class="bg-white w-full max-w-md rounded-xl shadow-lg p-6 h-fit">
      <h1 class="text-3xl font-bold text-blue-600 text-center mb-8">
        Task Flow
      </h1>

      <div class="flex gap-2 mb-6">
        <input
          type="text"
          id="taskInput"
          class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Add a new task..."
          autocomplete="off"
        />
        <button
          id="addBtn"
          onclick="getTaskInput()"
          class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-semibold transition duration-200"
        >
          Add
        </button>
      </div>

      <div class="space-y-4 mb-6">
        <input
          type="text"
          id="searchInput"
          class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-400"
          placeholder="Search tasks..."
        />

        <div
          class="flex justify-between items-center bg-gray-50 p-1 rounded-lg"
        >
          <button
            class="filter-btn active flex-1 py-1 text-sm font-medium rounded-md bg-blue-600 text-white shadow-sm"
            data-filter="all"
          >
            All
          </button>
          <button
            class="filter-btn flex-1 py-1 text-sm font-medium text-gray-500 hover:text-gray-700"
            data-filter="active"
          >
            Active
          </button>
          <button
            class="filter-btn flex-1 py-1 text-sm font-medium text-gray-500 hover:text-gray-700"
            data-filter="all"
          >
            Completed
          </button>
        </div>
      </div>

      <ul
        id="taskList"
        class="divide-y divide-gray-100 max-h-96 overflow-y-auto pr-2"
      ></ul>

      <div
        class="mt-8 pt-6 border-t border-gray-100 flex justify-between items-center text-sm text-gray-500 font-medium"
      >
        <span id="taskCount">0 items left</span>
        <button
          id="clearCompleted"
          class="hover:text-red-500 transition-colors"
        >
          Clear Completed
        </button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
